<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>LUCA · demonstrație</title>
<script>
  /* GitHub Pages serves this file for any missing address, at any depth: go back to the demo.
     Project site (github.io, or a local test server): the first path segment is the site folder.
     Addresses of the live app are mapped: rapoarte/N -> raport.html?id=N, rapoarte, login. */
  (function () {
    var loc = window.location;
    var seg = loc.pathname.split("/").filter(Boolean);
    var gazda = loc.hostname;
    var proiect = /\.github\.io$/i.test(gazda) || gazda === "127.0.0.1" || gazda === "localhost";
    var n = proiect ? Math.min(1, seg.length) : 0;
    var radacina = loc.origin + "/" + (n ? seg.slice(0, n).join("/") + "/" : "");
    var rest = seg.slice(n);
    var tinta = "index.html" + loc.search;
    if (rest[0] === "rapoarte" && rest.length === 2 && /^\d+$/.test(rest[1])) tinta = "raport.html?id=" + rest[1];
    else if (rest[0] === "rapoarte" && rest.length === 1) tinta = "rapoarte.html";
    else if (rest[0] === "login" && rest.length === 1) tinta = "login.html";
    loc.replace(radacina + tinta);
  })();
</script>
</head>
<body style="font-family: 'Segoe UI', system-ui, sans-serif; margin: 2rem; color: #181A1B;">
<p>Pagina nu există. <a href="index.html">Înapoi la demonstrație</a></p>
</body>
</html>
